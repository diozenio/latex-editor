[package]
name = "folio-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
trash = "5"
regex = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
