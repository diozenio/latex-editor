name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.pr.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.pr.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - id: pr
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        if: ${{ steps.pr.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.pr.outputs.pr).headBranchName }}
      - name: Sync Cargo.lock with the release version
        if: ${{ steps.pr.outputs.pr }}
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          perl -0pi -e 's/(name = "quilltex(?:-core|-mcp)?"\nversion = ")[^"]+/${1}'"$version"'/g' Cargo.lock
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "chore(release): sync cargo lock to $version"
            git push -q
          fi
      - name: Merge the release pull request
        if: ${{ steps.pr.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ fromJSON(steps.pr.outputs.pr).number }}" --squash --repo "${{ github.repository }}"
      - id: release
        if: ${{ steps.pr.outputs.pr }}
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
