name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.pr.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.pr.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - id: pr
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Merge the release pull request
        if: ${{ steps.pr.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ fromJSON(steps.pr.outputs.pr).number }}" --squash --repo "${{ github.repository }}"
      - id: release
        if: ${{ steps.pr.outputs.pr }}
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
